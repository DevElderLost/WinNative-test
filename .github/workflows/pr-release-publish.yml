name: PR Release Publish

on:
  workflow_dispatch:   # manual run
  workflow_run:
    workflows:
      - PR CI
    types:
      - completed

concurrency:
  group: pr-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        run: echo "Download & process artifact di sini (tetap sama seperti sebelumnya)"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.WINNATIVE_CI_TOKEN }}
        run: |
          tag="pr-${{ github.run_number }}"
          gh release create "$tag" \
            --title "PR Release" \
            --notes "Auto generated release" \
            --prerelease || \
          gh release edit "$tag" \
            --title "PR Release" \
            --notes "Updated release" \
            --prerelease