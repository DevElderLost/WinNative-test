name: PR Release Publish

on:
  workflow_run:
    workflows: [ PR CI ]
    types: [ completed ]
  workflow_dispatch:   # <-- tombol manual

concurrency:
  group: pr-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # ✅ support AUTO + MANUAL tanpa konflik
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:
      - name: Debug Event
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "conclusion=${{ github.event.workflow_run.conclusion }}"

      # =========================
      # MODE: AUTO (dari PR CI)
      # =========================
      - name: Download artifacts (auto)
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p artifacts
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --dir artifacts

      # =========================
      # MODE: MANUAL
      # =========================
      - name: Download artifacts (manual fallback)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Manual mode: skip download atau isi manual jika perlu"

      # =========================
      # RELEASE (shared logic)
      # =========================
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="manual-${{ github.run_number }}"
          echo "Creating release $tag"

          gh release create "$tag" \
            --title "Manual / Auto Release $tag" \
            --notes "Generated by workflow"

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -name "*.apk" -print0 | while IFS= read -r -d '' file; do
            gh release upload "manual-${{ github.run_number }}" "$file" || true
          done